name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# Signs in to AWS with GitHub's OIDC token, so no AWS keys are stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::161099087454:role/bannaa-website-deploy
  S3_BUCKET: bannaa-website-161099087454
  CLOUDFRONT_DISTRIBUTION_ID: E27SBJIMAEVHNW

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed files in assets/ never change, so cache them for a year; everything else is revalidated.
      - name: Sync to S3
        run: |
          aws s3 sync dist/assets s3://$S3_BUCKET/assets --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ s3://$S3_BUCKET --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
